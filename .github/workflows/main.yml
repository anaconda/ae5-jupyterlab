name: Build project
on:
  push:
    tags:
      - '*'
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  bringup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Retrieve the source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Log in to gcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: gcr.io
        username: _json_key
        password: ${{ secrets.AE_GCR_KEY }}
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '24'
    - name: Install Playwright
      run: |
        npm install @playwright/test@^1.63.0
        npx playwright install --with-deps chromium
    - name: Run JupyterLab bringup test
      id: bringup
      env:
        AE_GCR_KEY: ${{ secrets.AE_GCR_KEY }}
      run: bash ./ci_test.sh
    - name: Upload screenshot artifact
      if: always() && hashFiles('test_screenshot*.png') != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: jupyterlab-bringup-screenshots
        path: test_screenshot*.png
    - name: Post screenshot comment
      if: always() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        UPLOAD_TOKEN: ${{ secrets.GITHUB_PLATFORM_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_ID: ${{ github.repository_id }}
        IMAGE_VER: ${{ steps.bringup.outputs.image_ver }}
        JUPYTERLAB_VER: ${{ steps.bringup.outputs.expected_version }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        names=(test_screenshot*.png)
        screenshots=()
        if [ ${#names[@]} -gt 0 ]; then
          readarray -t screenshots < <(printf '%s\n' "${names[@]}" | LC_ALL=C sort)
        fi
        img_md=""
        upload_failed=0
        for f in "${screenshots[@]}"; do
          upload_json=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${UPLOAD_TOKEN}" \
            -H "Accept: application/json" \
            --data-binary @"$f" \
            "https://uploads.github.com/user-attachments/assets?name=$(basename "$f")&content_type=image/png&repository_id=${REPO_ID}" \
            || true)
          asset_url=$(printf '%s' "$upload_json" | jq -r '.href // .url // empty' 2>/dev/null || true)
          if [ -n "$asset_url" ]; then
            img_md="${img_md}![${f}](${asset_url})"$'\n\n'
          else
            echo "Screenshot upload failed for ${f}: ${upload_json}" >&2
            upload_failed=1
          fi
        done
        body_file=$(mktemp)
        {
          echo '<!-- jupyterlab-bringup-screenshot -->'
          echo '## JupyterLab bringup'
          echo
          echo "Image: \`ae-editor-base:${IMAGE_VER:-unknown}\` · JupyterLab \`${JUPYTERLAB_VER:-unknown}\` · [run](${RUN_URL})"
          echo
          if [ -n "$img_md" ]; then
            printf '%s' "$img_md"
          elif [ ${#screenshots[@]} -gt 0 ]; then
            echo "Screenshots captured but could not attach inline. See the [run artifact](${RUN_URL})."
          else
            echo 'Bringup **failed** before a screenshot was captured.'
          fi
        } > "$body_file"
        old_ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
          --jq '.[] | select(.body | contains("<!-- jupyterlab-bringup-screenshot -->")) | .id' \
          || true)
        gh issue comment "$PR_NUMBER" --body-file "$body_file"
        for id in $old_ids; do
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" || true
        done
        if [ ${#screenshots[@]} -gt 0 ] && [ "$upload_failed" -eq 1 ]; then
          exit 1
        fi

  publish:
    needs: [bringup]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
    - name: Retrieve the tested source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Build the archive
      run: |
        set -euo pipefail
        curl -fsSL https://pixi.sh/install.sh | bash
        export PATH="$HOME/.pixi/bin:$PATH"
        pixi global install pixi-pack
        bash download_jupyterlab.sh
        tar cfj jupyter-blobs.tar.bz2 --exclude='.pixi-pack-cache' downloads
        mkdir -p staging
        git archive --format=tar --prefix=Jupyter_Installer/ HEAD | tar -x -C staging
        rm -rf staging/Jupyter_Installer/.github
        tar cfj jupyter-installer.tar.bz2 -C staging Jupyter_Installer
    - name: Determine the suffixes and upload the content
      env:
        BEFORE_SHA: ${{ github.event.before }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
      run: |
        set -euo pipefail
        suffixes=()
        create_tag=""
        if [[ "$GITHUB_REF_TYPE" = tag ]]; then
          echo "Manual tag event; just adding the tagged release"
          suffixes+=("-$GITHUB_REF_NAME")
        elif [[ "$GITHUB_EVENT_NAME" = push && "$GITHUB_REF" = "refs/heads/master" ]]; then
          echo "PR merged to main; updating untagged and -latest"
          suffixes+=("" "-latest")
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
             && ! git diff --quiet "$BEFORE_SHA" HEAD -- pixi.lock; then
            create_tag="$(git show -s --format=%cI | sed 's@T.*@@;s@-@@g')"
            echo "pixi.lock changed; also auto-generating new tag: $create_tag"
            suffixes+=(-"$create_tag")
          fi
        else
          echo "Uploading a development build only"
          suffixes+=("-dev")
        fi
        for suffix in "${suffixes[@]}"; do
          for fname in jupyter-installer.tar.bz2 jupyter-blobs.tar.bz2; do
            dname="$(echo "$fname" | sed -E "s@.tar.bz2\$@${suffix}.tar.bz2@")"
            echo "$fname -> s3://airgap-svc/misc/$dname"
            aws s3 cp --quiet "$fname" "s3://airgap-svc/misc/$dname" --acl public-read --region "$AWS_DEFAULT_REGION"
          done
        done
        if [ -n "$create_tag" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$create_tag" -m release
          git push origin "refs/tags/$create_tag" --force
        fi
